# The database Nessy's engine keeps its agents in. Spring Boot starts this for you when the
# module runs, via spring-boot-docker-compose.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: guvnor
      POSTGRES_USER: guvnor
      POSTGRES_PASSWORD: guvnor
    ports:
      # An ephemeral host port, not 5432. A developer very likely already has something on
      # 5432, and Spring Boot discovers whichever port Docker actually assigned.
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guvnor"]
      interval: 5s
      timeout: 5s
      retries: 10
