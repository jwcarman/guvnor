spring.application.name=guvnor-1-naive
server.port=8081

# The model these agents talk to. Nessy sends this name to whichever InferenceProvider bean is
# present, so it is required even when that provider ignores it.
#
# Override for a local runtime, which needs no cloud account:
#   OPENAI_API_KEY=lm-studio OPENAI_BASE_URL=http://localhost:1234/v1 NESSY_MODEL=<model-id>
nessy.model=gpt-4o-mini

# Quiet everything except the desk, whose whole purpose is to be watched.
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.jwcarman.guvnor=INFO
logging.level.desk=INFO
logging.pattern.console=%clr(%-5level) %clr(%logger{0}){cyan} %msg%n
