spring.application.name=guvnor-3-concealed
server.port=8083

# The model these agents talk to. Nessy sends this name to whichever InferenceProvider bean is
# present, so it is required even when that provider ignores it.
#
# For a local runtime, which needs no cloud account:
#   OPENAI_API_KEY=lm-studio OPENAI_BASE_URL=http://localhost:1234/v1 NESSY_MODEL=<model-id>
nessy.model=gpt-4o-mini
guvnor.lesson=Lesson 3 - the mail is concealed; the model reads a governed view of it.
